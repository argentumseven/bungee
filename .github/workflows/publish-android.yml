name: Publish Android APK to Releases
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-android.yml
      - scripts/publish-android.py
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: bungee-android-releases
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'argentumseven/bungee'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Publish the verified Android build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNGEE_BUILD_RUN_ID: ''
        run: python3 scripts/publish-android.py
