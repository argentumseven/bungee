name: Build and verify Bungee
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: "web/package-lock.json",
          }
      - uses: dtolnay/rust-toolchain@1.90.0
        with: { components: "clippy,rustfmt" }
      - run: python3 scripts/check-doc-images.py
      - run: npm ci && npm ci --prefix web && npm run build --prefix web
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml && cargo build --locked --manifest-path server/Cargo.toml && npm test
      - run: sudo apt-get update && sudo apt-get install --yes age openssl
      - run: npm run test:tls
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: npx playwright-core install --with-deps chromium firefox
      - run: CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1) npm run test:browser
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platforms;android-36 build-tools;35.0.0 platform-tools ndk;28.2.13676358"
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-go@v6
        with:
          {
            go-version: "1.26.9",
            cache-dependency-path: "native/transport/go.sum",
          }
      - run: go test -race ./... -count=1
        working-directory: native/transport
      - run: bash scripts/build-transport.sh
      - run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:lintDebug :app:testDebugUnitTest
        working-directory: android
      - name: Prepare unsigned release input
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/bungee-unsigned.apk
          cd artifacts
          sha256sum bungee-unsigned.apk > bungee-unsigned.apk.sha256
      - uses: actions/upload-artifact@v5
        id: android_apk
        with:
          name: bungee-android-build
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  apk-signing:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "build-tools;35.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v5
        with: {name: bungee-android-build, path: artifacts}
      - run: python3 scripts/check-app-signer.py artifacts/bungee-unsigned.apk
  release-apk:
    if: github.repository == 'argentumseven/bungee' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [server-and-web, android, apk-signing, container-boundaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "build-tools;35.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v5
        with: { name: bungee-android-build, path: artifacts }
      - name: Sign once with the persistent release identity
        env:
          BUNGEE_RELEASE_KEYSTORE_BASE64: ${{ secrets.BUNGEE_RELEASE_KEYSTORE_BASE64 }}
          BUNGEE_RELEASE_STORE_PASSWORD: ${{ secrets.BUNGEE_RELEASE_STORE_PASSWORD }}
          BUNGEE_RELEASE_SIGNER_SHA256: ${{ vars.BUNGEE_RELEASE_SIGNER_SHA256 }}
          BUNGEE_RELEASE_KEY_ALIAS: ${{ vars.BUNGEE_RELEASE_KEY_ALIAS }}
        run: python3 scripts/release_signing.py artifacts/bungee-unsigned.apk release-apk
      - uses: actions/upload-artifact@v5
        id: signed_apk
        with:
          name: bungee-android-release
          path: release-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Show official APK download
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Official Android APK

          [Download signed APK and checksum (ZIP)](${{ steps.signed_apk.outputs.artifact-url }})

          This APK uses the persistent release key. GitHub Releases and the server distribute the same APK.
          The separate build artifact is unsigned and cannot be installed; use this official signed APK.
          SUMMARY
  publish-main-apk:
    if: github.repository == 'argentumseven/bungee' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [release-apk]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: bungee-android-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Publish Android APK in Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUNGEE_BUILD_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/publish-android.py
  container-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: docker build -t bungee-gateway:dev -f deploy/wireguard/Dockerfile deploy && docker build -t bungee-server:dev .
      - run: npm run test:network
      - run: node scripts/check-server-container.mjs
      - run: sudo apt-get update && sudo apt-get install --yes age openssl
      - run: python3 scripts/check-updater.py
  publish-containers:
    if: github.repository == 'argentumseven/bungee' && startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [server-and-web, android, apk-signing, container-boundaries, release-apk]
    runs-on: ubuntu-24.04
    concurrency:
      group: bungee-publish-${{ contains(github.ref_name, '-') && 'preview' || 'stable' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: server
        with:
          context: .
          build-args: BUNGEE_SOURCE_COMMIT=${{ github.sha }}
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/argentumseven/bungee-server:${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
      - uses: docker/build-push-action@v6
        id: gateway
        with:
          context: deploy
          file: deploy/wireguard/Dockerfile
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/argentumseven/bungee-gateway:${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
      - name: Check the exact published amd64 candidates before channel promotion
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          set -euo pipefail
          for service in server gateway; do
            key="${service^^}_DIGEST"
            reference="ghcr.io/argentumseven/bungee-$service@${!key}"
            docker pull "$reference"
            docker tag "$reference" "bungee-$service:dev"
          done
          npm run test:network
          node scripts/check-server-container.mjs
          sudo apt-get update && sudo apt-get install --yes age openssl
          python3 scripts/check-updater.py
      - name: Assemble one immutable stack manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          GATEWAY_DIGEST: ${{ steps.gateway.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, time
          version = os.environ['RELEASE_VERSION'].removeprefix('v')
          release = json.loads(pathlib.Path('release.json').read_text())
          assert version == release['version'], 'Tag and release manifest must match'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-alpha\.[1-9][0-9]*)?', version)
          images = {}
          for service in ('server', 'gateway'):
              digest = os.environ[service.upper() + '_DIGEST']
              assert re.fullmatch(r'sha256:[a-f0-9]{64}', digest)
              images[service] = f'ghcr.io/argentumseven/bungee-{service}@{digest}'
          path = pathlib.Path('release-bundle'); path.mkdir()
          (path / 'release.json').write_text(json.dumps({'format': 1, 'host_api': release['host_api'], 'data_contract': release['data_contract'], 'version': version, 'published_at': int(time.time()), 'images': images}))
          PY
          if [[ "$RELEASE_VERSION" == *-* ]]; then channel=preview; else channel=stable; fi
          echo "BUNGEE_RELEASE_CHANNEL=$channel" >> "$GITHUB_ENV"
      - name: Publish the immutable bundle
        uses: docker/build-push-action@v6
        id: bundle
        with:
          context: release-bundle
          file: deploy/release.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/argentumseven/bungee-release:${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          provenance: mode=max
      - name: Atomically promote without moving the channel backwards
        env:
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.digest }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, subprocess
          spec = importlib.util.spec_from_file_location('host', 'scripts/bungee-host.py')
          host = importlib.util.module_from_spec(spec); spec.loader.exec_module(host)
          repository = 'ghcr.io/argentumseven/bungee-release'
          channel = repository + ':' + os.environ['BUNGEE_RELEASE_CHANNEL']
          candidate = json.loads(pathlib.Path('release-bundle/release.json').read_text())
          result = subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', channel], capture_output=True, text=True)
          if result.returncode:
              if 'manifest unknown' not in result.stderr.lower() and 'not found' not in result.stderr.lower():
                  raise SystemExit(result.stderr)
          else:
              container = subprocess.check_output(['docker', 'create', '--platform', 'linux/amd64', channel], text=True).strip()
              try:
                  subprocess.check_call(['docker', 'cp', container + ':/release.json', 'release-bundle/current.json'])
                  previous = json.loads(pathlib.Path('release-bundle/current.json').read_text())
              finally:
                  subprocess.check_call(['docker', 'rm', '--volumes', container])
              if host.version(candidate['version']) < host.version(previous['version']) or candidate['published_at'] <= previous['published_at']:
                  print('A newer bundle already owns this channel; immutable artifact kept, channel unchanged.')
                  raise SystemExit(0)
          subprocess.check_call(['docker', 'buildx', 'imagetools', 'create', '--tag', channel, repository + '@' + os.environ['BUNDLE_DIGEST']])
          PY
  publish-apk:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [server-and-web, android, container-boundaries, release-apk, publish-containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: bungee-android-release
          path: artifacts
      - name: Verify artifact and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          cd artifacts
          sha256sum --check bungee.apk.sha256
          cat > release-notes.md <<'NOTES'
          Install **bungee.apk** on a consenting Android 12+ device. Verify the accompanying SHA-256 checksum. The build supports ARM64 and x86_64.

          Bungee provides retained GPS/check-in/IP history, recurring time lookups and CSV; an encrypted offline GPS queue; household-approved recovery commands; local OpenStreetMap/GeoIP datasets; and an app-contained WireGuard connection that leaves Android's VPN slot free. Runtime map, analytics, DNS and push-provider fallbacks are absent. DNS routing, relay services and logs were removed in 1.1.17.

          Update the server before the APK. GPS erasure rotates a server generation so earlier queued/in-flight fixes cannot restore erased points. Consent withdrawal invalidates prepared work and cancels active captures/requests; bytes already delivered home cannot be recalled. Locate requires current consent, a server expiry check and an exact stored-fix acknowledgment.

          Guided installation requires custom HTTPS/WireGuard ports and administrator source prefixes. The host updater stages immutable image bundles, closes admission, encrypts cold snapshots of all sensitive storage and restores a failed trial before reopening. Runtime containers do not receive the Docker socket.

          Device-owner enrollment and persistent MDM controls are disabled. The separate Bungee recovery launcher can stop controls offline without pairing keys or a server. Ordinary Android deactivation/uninstall remains available. No wipe, credential reset, firmware/bootloader action, kiosk mode or remote reboot is implemented.

          This APK uses the persistent official release key. GitHub and server downloads are identical, and routine upgrades preserve pairing and app data. Older disposable-key installations still require a one-time move to the official signer; the previous private key cannot be recovered from an APK.

          Physical GrapheneOS lifecycle checks remain unperformed. Independent publisher-signature verification remains open. The host installer uses LUKS2 storage, host-key boot unlock and age-encrypted archives. Certificate/device/APK signatures remain classical. Read README.md, docs/SECURITY.md, docs/INSTALL.md and docs/VALIDATION.md for feature scope, trust assumptions and test evidence.
          NOTES
          release_flags=(--prerelease=false)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then release_flags=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" bungee.apk bungee.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft "${release_flags[@]}" \
            --title "Bungee $GITHUB_REF_NAME" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "${release_flags[@]}"
