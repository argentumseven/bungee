name: Check foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '24', cache: npm, cache-dependency-path: 'web/package-lock.json'}
      - uses: dtolnay/rust-toolchain@1.90.0
        with: {components: 'clippy,rustfmt'}
      - run: npm ci && npm ci --prefix web && npm run build --prefix web
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo build --locked --manifest-path server/Cargo.toml && npm test
      - run: npx playwright-core install --with-deps chromium
      - run: CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1) npm run test:browser
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: android
      - name: Prepare installable development APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/bungee-debug.apk
          cd artifacts
          sha256sum bungee-debug.apk > bungee-debug.apk.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: bungee-android-debug
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [server-and-web, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: bungee-android-debug
          path: artifacts
      - name: Verify artifact and publish test prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          cd artifacts
          sha256sum --check bungee-debug.apk.sha256
          cat > release-notes.md <<'NOTES'
          Install **bungee-debug.apk** on a consenting Android 12+ test device. The accompanying SHA-256 file verifies the download.

          This is a signed **debug build** of an unaudited prototype, not a production security release. Debug signing keys are generated by CI; future test builds may require uninstalling the old app, which erases its local pairing identity.

          A self-hosted Bungee server and a reachable WireGuard endpoint are required. Physical GrapheneOS behavior and real VPN routing remain unverified. Android permits one VPN per profile. Failed-unlock photos, launcher hiding, overlays, and full MDM are not implemented.
          NOTES
          gh release create "$GITHUB_REF_NAME" bungee-debug.apk bungee-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Bungee $GITHUB_REF_NAME — development preview" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
