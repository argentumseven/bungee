name: Check foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: "web/package-lock.json",
          }
      - uses: dtolnay/rust-toolchain@1.90.0
        with: { components: "clippy,rustfmt" }
      - run: npm ci && npm ci --prefix web && npm run build --prefix web
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml && cargo build --locked --manifest-path server/Cargo.toml && npm test
      - run: npx playwright-core install --with-deps chromium
      - run: CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1) npm run test:browser
      - run: npm run test:tls
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platforms;android-36 build-tools;35.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
        working-directory: android
      - name: Prepare installable development APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/bungee-debug.apk
          cd artifacts
          sha256sum bungee-debug.apk > bungee-debug.apk.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: bungee-android-debug
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  container-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: docker build -t bungee-gateway:dev deploy/wireguard && docker build -t bungee-server:dev .
      - run: npm run test:network
  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [server-and-web, android, container-boundaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: bungee-android-debug
          path: artifacts
      - name: Verify artifact and publish test prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          cd artifacts
          sha256sum --check bungee-debug.apk.sha256
          cat > release-notes.md <<'NOTES'
          Install **bungee-debug.apk** on a consenting Android 12+ test device. The accompanying SHA-256 file verifies the download.

          GPS and device check-in history now stay saved until explicitly erased. The dashboard supports time-range lookup, a private coordinate trail and CSV export. The phone has a bounded encrypted offline GPS queue.

          This version requires a custom UDP port (51820 is rejected) and new version-2 enrollment with a unique 256-bit WireGuard preshared key. Dashboard HTTPS uses a trusted local CA and requires TLS 1.3 X25519MLKEM768. Runtime networking denies new provider connections. Legacy identities must re-pair; saved data is preserved until erased/revoked. Update BOTH server and APK.

          Post-quantum key-exchange/PSK protection does not make the product fully post-quantum authenticated: certificate and device request signatures remain classical. Read docs/SECURITY.md for the exact boundary. OS-assisted GNSS/system traffic remains controlled by GrapheneOS settings.

          This is a signed **debug build** of an unaudited prototype, not a production security release. Debug signing keys are generated by CI; future test builds may require uninstalling the old app, which erases its local pairing identity.

          A self-hosted Bungee server and a reachable WireGuard endpoint are required. Physical GrapheneOS behavior and real VPN routing remain unverified. Android permits one VPN per profile. Failed-unlock photos, launcher hiding, overlays, and full MDM are not implemented.
          NOTES
          gh release create "$GITHUB_REF_NAME" bungee-debug.apk bungee-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Bungee $GITHUB_REF_NAME — development preview" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
