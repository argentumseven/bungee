name: Check foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: 'web/package-lock.json'}
      - uses: dtolnay/rust-toolchain@1.90.0
        with: {components: 'clippy,rustfmt'}
      - run: npm ci && npm ci --prefix web && npm run build --prefix web
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo build --locked --manifest-path server/Cargo.toml && npm test
      - run: npx playwright-core install --with-deps chromium
      - run: CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1) npm run test:browser
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug
        working-directory: android
