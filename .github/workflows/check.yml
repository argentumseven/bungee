name: Check foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  server-and-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: "web/package-lock.json",
          }
      - uses: dtolnay/rust-toolchain@1.90.0
        with: { components: "clippy,rustfmt" }
      - run: npm ci && npm ci --prefix web && npm run build --prefix web
      - run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml && cargo build --locked --manifest-path server/Cargo.toml && npm test
      - run: npx playwright-core install --with-deps chromium
      - run: CHROME_BIN=$(find "$HOME/.cache/ms-playwright" -path '*/chrome-linux*/chrome' -type f | head -1) npm run test:browser
      - run: npm run test:tls
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platforms;android-36 build-tools;35.0.0 platform-tools ndk;28.2.13676358"
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-go@v6
        with:
          {
            go-version: "1.26.9",
            cache-dependency-path: "native/transport/go.sum",
          }
      - run: go test ./... -count=1
        working-directory: native/transport
      - run: bash scripts/build-transport.sh
      - run: ./gradlew --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
        working-directory: android
      - name: Prepare installable development APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/bungee-debug.apk
          cd artifacts
          sha256sum bungee-debug.apk > bungee-debug.apk.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: bungee-android-debug
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  container-boundaries:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: docker build -t bungee-gateway:dev deploy/wireguard && docker build -t bungee-server:dev .
      - run: npm run test:network
  prerelease:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [server-and-web, android, container-boundaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: bungee-android-debug
          path: artifacts
      - name: Verify artifact and publish test prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          cd artifacts
          sha256sum --check bungee-debug.apk.sha256
          cat > release-notes.md <<'NOTES'
          Install **bungee-debug.apk** on a consenting Android 12+ test device. The accompanying SHA-256 file verifies the download.

          GPS/check-in history stays saved until erased. History now supports every-N-minute and daily-at-time lookups, private coordinate trails and CSV. The phone has a bounded encrypted offline GPS queue.

          Personal mode carries only Bungee's home API through app-contained WireGuard without taking Android's VPN slot. Optional fully managed mode adds system DNS through home, summarized DNS groups, selected-app suspension, lost mode, lock requirements, recovery settings protection and opt-in secure reboot. System DNS / Android always-on mode still occupies the profile's VPN slot. App-controlled DNS and other profiles have coverage limits. Reboot is not power-off or wipe; recovery stops until first unlock. Read docs/MANAGEMENT.md.

          Update BOTH server and APK. Choose a custom UDP port (51820 rejected). Version-2 pairing requires a per-peer random 256-bit WireGuard PSK. Dashboard HTTPS requires the trusted local CA and TLS 1.3 X25519MLKEM768. Certificate/device/APK signatures remain classical; this is not a wholly quantum-proof product. Runtime egress is denied except the operator's explicitly configured private home DNS upstream. No public DNS fallback, telemetry provider, analytics or cloud push.

          This is a signed **debug build** of an unaudited prototype for test devices. CI debug keys are ephemeral: updates may require uninstall/re-pair. **Do not enroll a persistent managed phone with CI debug signing.** Build with your own stable signing key using scripts/build-owner-apk.sh.

          ARM64 phones and x86_64 test devices, Android 12+. Native WireGuard protocol tests run without kernel TUN. Physical GrapheneOS routing, other-VPN coexistence, lifecycle and device-owner provisioning still need testing. Automatic photos, hidden launcher, remote power-off/wipe and crowdsourced finding are absent. See README.md for the full feature checklist and docs/VALIDATION.md for evidence.
          NOTES
          gh release create "$GITHUB_REF_NAME" bungee-debug.apk bungee-debug.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease \
            --title "Bungee $GITHUB_REF_NAME — development preview" --notes-file release-notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
