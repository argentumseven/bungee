name: Refresh tested stable container images
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Run all release checks against the latest stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! tag=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name 2>github-error.txt); then
            if rg -q 'HTTP 404' github-error.txt; then
              echo 'No stable release is available; nothing is promoted.'
              exit 0
            fi
            cat github-error.txt >&2
            exit 1
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gh workflow run check.yml --repo "$REPOSITORY" --ref "$tag"
