name: bungee
services:
  gateway:
    build: ./deploy/wireguard
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, CHOWN, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/run:mode=0700]
    environment:
      BUNGEE_WG_PORT: ${BUNGEE_WG_PORT:?Choose a custom UDP port in .env}
    ports:
      - "${BUNGEE_WG_PORT:?Choose a custom UDP port}:${BUNGEE_WG_PORT:?Choose a custom UDP port}/udp"
      - "${BUNGEE_ADMIN_ADDRESS:-127.0.0.1}:443:443"
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    volumes:
      - gateway-private:/private
      - gateway-peers:/peers
    healthcheck:
      test: [CMD, wg, show, wg0]
      interval: 10s
      timeout: 3s
      retries: 5
  server:
    build: .
    restart: unless-stopped
    network_mode: service:gateway
    depends_on:
      gateway: {condition: service_healthy}
    environment:
      BUNGEE_PUBLIC_ORIGIN: https://${BUNGEE_DOMAIN:?Set BUNGEE_DOMAIN in .env}
      BUNGEE_ADMIN_BIND: 127.0.0.1:8080
      BUNGEE_DEVICE_BIND: 10.77.0.1:8081
      BUNGEE_WG_ENDPOINT: ${BUNGEE_WG_ENDPOINT:?Set BUNGEE_WG_ENDPOINT to your reachable IP and custom port}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:size=16m]
    volumes:
      - server-data:/state
      - gateway-peers:/state/wireguard
  web:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      BUNGEE_DOMAIN: ${BUNGEE_DOMAIN:?Set BUNGEE_DOMAIN in .env}
    network_mode: service:gateway
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp:size=16m]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server: {condition: service_healthy}
volumes:
  server-data:
  gateway-private:
  gateway-peers:
  caddy-data:
  caddy-config:
