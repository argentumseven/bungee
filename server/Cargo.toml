[package]
name = "bungee-server"
version = "1.1.2"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
hickory-proto = "0.25"
psl = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
tower-http = { version = "0.6", features = ["fs", "set-header", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "hooks"] }
futures-core = "0.3"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
maxminddb = "0.32"

[profile.release]
lto = "thin"
strip = true
